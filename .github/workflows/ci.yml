name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check
      - run: make vet
      - run: make test
      - run: make build

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make shellcheck

  image:
    name: image
    runs-on: ubuntu-latest
    needs: [go, shell]
    steps:
      - uses: actions/checkout@v4
      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap squashfs-tools xorriso mtools dosfstools \
            debian-archive-keyring \
            grub-efi-amd64-bin grub-pc-bin qemu-system-x86
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the agent
        run: make build
      - name: Build image
        run: sudo os/build.sh
      - name: Boot image under QEMU
        run: os/test/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: phantommc-iso
          path: out/*.iso
          retention-days: 7
